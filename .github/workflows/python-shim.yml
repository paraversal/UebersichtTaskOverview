name: Python shim

on:
  push:
    tags: ["py-shim-v*"]

defaults:
  run:
    working-directory: python-shim

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv publish
